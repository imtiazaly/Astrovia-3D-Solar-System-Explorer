<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient matching Astrovia navbar brand -->
    <linearGradient id="astrovia-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="48%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="astrovia-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>

    <!-- Orbit Stroke Gradient -->
    <linearGradient id="orbit-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Star Core Radial Gradient -->
    <radialGradient id="star-core" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
  </defs>

  <!-- Astrovia App Icon Rounded Badge -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#astrovia-grad)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8" filter="url(#astrovia-glow)"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="14.5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.18" fill="none"/>

  <!-- Celestial Orbit System (Centered in the icon) -->
  <g transform="translate(32, 32) scale(1.85) translate(-12, -12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Orbital Arcs -->
    <path d="M20.341 6.484A10 10 0 0 1 10.266 21.85" stroke="url(#orbit-stroke)" stroke-width="2.2"/>
    <path d="M3.659 17.516A10 10 0 0 1 13.74 2.152" stroke="url(#orbit-stroke)" stroke-width="2.2"/>
    
    <!-- Central Celestial Star / Planet -->
    <circle cx="12" cy="12" r="3.2" fill="url(#star-core)" stroke="#67e8f9" stroke-width="0.8"/>
    
    <!-- Orbiting Bodies / Moons -->
    <circle cx="19" cy="5" r="2.2" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <circle cx="5" cy="19" r="2.2" fill="#67e8f9" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Telemetry Beacon Status Indicator (Active live explorer) -->
  <circle cx="51.5" cy="51.5" r="5" fill="#10b981" stroke="#020617" stroke-width="2"/>
  <circle cx="51.5" cy="51.5" r="2.5" fill="#a7f3d0"/>
</svg>